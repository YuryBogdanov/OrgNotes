# The checks of every pull request and of main (tech sprint 6.1): what `npm run verify` runs by hand.
# macOS, because the app is: WebKit for the e2e (the app runs in WKWebView) and Swift for the Rust side.
name: CI
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    name: Types, unit, e2e (${{ matrix.shard }}/2)
    runs-on: macos-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # the e2e in two halves at once: a macOS runner is several times slower than a desk Mac
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
        if: matrix.shard == 1
      - run: npm run lint
        if: matrix.shard == 1
      - run: npm test
        if: matrix.shard == 1
      - name: WebKit for Playwright
        run: npx playwright install webkit
      - name: e2e
        run: npm run e2e -- --shard=${{ matrix.shard }}/2
        env:
          E2E_PORT: 1431
      - name: The traces of what failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ matrix.shard }}
          path: test-results/
          retention-days: 7
  rust:
    name: Rust
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      # the app's crate embeds the built front end (../dist) at compile time
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml
